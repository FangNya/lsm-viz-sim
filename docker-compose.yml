services:
  backend:
    build:
      context: ./backend
    container_name: lsm_backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: lsm_frontend
    environment:
      - VITE_BACKEND_HTTP_TARGET=http://backend:8000
      - VITE_BACKEND_WS_TARGET=ws://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
